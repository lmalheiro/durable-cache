name: Release-plz
# release-plz keeps a release pull request open: the next version of
# durable-cache, chosen from the conventional commit subjects since the last
# release (cargo-semver-checks flags API breaks), and its changelog entry.
# Merging that PR releases it: the version is tagged v<version>, published
# to crates.io, and given a GitHub release. The crates.io token lives in the
# `crates-io` environment, which only runs on main may use, and only the
# release job, only for that merge, reads it. release-plz.toml has the
# settings; the README's "Releasing" section, the steps.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Whether this push merged a release PR: release-plz opens them from
  # branches named release-plz-*. Only then does the release job start, so
  # no other push reaches the token, or records a deployment to crates-io.
  release-pr-merged:
    if: github.repository_owner == 'lmalheiro'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          branch=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.ref // ""')
          if [[ $branch == release-plz-* ]]; then merged=true; else merged=false; fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

  # Tags, publishes and releases the version on main if it is not on
  # crates.io yet. release-plz checks again that the commit merged a release
  # PR (release_always = false): an ordinary push publishes nothing.
  release-plz-release:
    name: Release-plz release
    needs: release-pr-merged
    if: needs.release-pr-merged.outputs.merged == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      # To tell whether the commit on main merged a release PR.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The crates-io environment's secret: a token scoped to publishing
          # durable-cache, since a new crate's first version cannot use
          # trusted publishing. Once that is set up for the crate, this job
          # gets `id-token: write` and the token goes.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the release PR, and points its README's links at the
  # version it releases. Pushes this workflow makes start no other workflow,
  # so CI runs on the release PR once a maintainer pushes to it, or closes
  # and reopens it.
  release-plz-pr:
    name: Release-plz PR
    if: github.repository_owner == 'lmalheiro'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The README on main links to the files of the latest release; the
      # release PR's README must link to those of the version it releases,
      # which crates.io will show with it. `cargo xtask readme-links` makes
      # that change on the PR's branch, committed there through the API as
      # this workflow: a signed commit, with no credentials on disk. The PR
      # still holds bot commits only, so release-plz keeps updating it, and
      # this step runs again after each update.
      - name: Point the release PR's README links at its version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<< "${PR:-null}")
          if [ -z "$branch" ]; then
            branch=$(gh api "repos/$REPO/pulls?state=open" \
              --jq '[.[] | select(.head.ref | startswith("release-plz-"))][0].head.ref // empty')
          fi
          if [ -z "$branch" ]; then
            echo "no release PR"
            exit 0
          fi
          git fetch --no-tags origin "$branch"
          git checkout --force --detach FETCH_HEAD
          cargo xtask readme-links
          if git diff --quiet -- README.md; then
            exit 0
          fi
          gh api --method PUT "repos/$REPO/contents/README.md" \
            -f branch="$branch" \
            -f sha="$(git rev-parse FETCH_HEAD:README.md)" \
            -f message="docs: point the README's links at the version this PR releases" \
            -f content="$(base64 -w0 README.md)" \
            --silent
