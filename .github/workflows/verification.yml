name: Verification

# The formal checks of ADR-VERIFICATION.FORMAL-01, which carry no time limit
# (HLR-VERIFICATION.FORMAL-01 leaves it to a later decision) and, for now,
# block neither a merge nor a release: no job here sets `timeout-minutes`,
# and none is a required check.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * *" # daily, the checks with the deeper bounds
  workflow_dispatch:

env:
  # Line tables keep file:line in backtraces at a fraction of full debug
  # info's size, which otherwise fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2

      - name: TC-VERIFICATION.RECORD-01 — the record of checked properties
        # verification/record.toml against the repository: each entry's test
        # case and requirements are declared in the specification, and each
        # check's harness exists once, named after its test case.
        run: nix develop -c cargo xtask verify

  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2

      - name: The exhaustive checks (TC-VERIFICATION.RUNS-01)
        # Ordinary tests that go through every case within their bounds,
        # where Kani cannot finish; each result and duration goes to the
        # job's summary.
        run: nix develop -c cargo xtask verify --checker exhaustive

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom # its builds carry --cfg durable_cache_loom

      - name: The loom checks (TC-VERIFICATION.RUNS-01)
        # Those the record marks `change`; daily, all of them, with a
        # deeper preemption bound. Each result and duration goes to the
        # job's summary.
        run: >-
          nix develop -c cargo xtask verify --checker loom
          ${{ github.event_name == 'schedule' && '--daily' || '' }}

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Kani builds the crate and its dependencies once more, with its own
        # compiler; drop preinstalled toolchains no job here uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: Swatinem/rust-cache@v2
        with:
          key: kani

      - name: The Kani checks (TC-VERIFICATION.RUNS-01)
        # Kani is not in nixpkgs: its action installs the pinned version,
        # then runs the checks the record marks `change`, and daily all of
        # them, each result and duration in the job's summary.
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: "0.68.0"
          command: >-
            cargo xtask verify --checker kani
            ${{ github.event_name == 'schedule' && '--daily' || '' }}

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        # Veil and its dependencies build from source in about 5 minutes,
        # into 2 GB of Lake's build directory.
        with:
          path: verification/protocol/.lake
          key: lake-${{ hashFiles('verification/protocol/lake-manifest.json', 'verification/protocol/lean-toolchain') }}

      - name: The Lean checks (TC-VERIFICATION.RUNS-01)
        # The theorems of verification/protocol, each checked by Lean's
        # kernel, and the axioms each rests on against the record's list.
        # elan installs the Lean version each Lake project names.
        run: nix develop -c cargo xtask verify --checker lean

  veil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        # Veil and its dependencies build from source in about 5 minutes,
        # into 2 GB of Lake's build directory.
        with:
          path: verification/protocol/.lake
          key: lake-${{ hashFiles('verification/protocol/lake-manifest.json', 'verification/protocol/lean-toolchain') }}

      - name: The Veil checks (TC-VERIFICATION.RUNS-01)
        # The protocol model's clauses, proved inductive with Lean checking
        # each of the SMT solver's proofs, its executions found and a finite
        # instance explored; and the axioms the proofs rest on against the
        # record's list.
        run: nix develop -c cargo xtask verify --checker veil

  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2

      - name: The trace checks (TC-VERIFICATION.RUNS-01)
        # MemCache and the backend through the storage contract's
        # workloads, each trace checked by the HttpCacheStorage library;
        # daily, four times as many workloads.
        run: >-
          nix develop -c cargo xtask verify --checker trace
          ${{ github.event_name == 'schedule' && '--daily' || '' }}

  log-writes:
    # The log-writes replay of TC-PERSISTENCE.CRASHSAFE-03, as root: loop
    # devices, the device-mapper log-writes target, mkfs and mount. Daily,
    # and by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2

      - name: The log-writes replays (TC-PERSISTENCE.CRASHSAFE-03)
        # ext4, ext4 with data=writeback and XFS with stores synchronised,
        # ext4 unsynchronised with the discard on and off; the state after
        # each write, and after each block of a longer one, checked.
        run: |
          sudo modprobe dm-log-writes
          nix develop -c cargo xtask verify --checker log-writes --daily
