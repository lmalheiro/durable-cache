# cargo-deny configuration. CI (.github/workflows/deny.yml) and developers run
#
#   cargo deny --manifest-path durable-cache/Cargo.toml --exclude-dev check
#
# which checks the published crate's own dependency graph: what an integrator
# builds. The test crates and xtask are never distributed, so they are left out.

[graph]
# Optional dependencies count too: an integrator may enable any feature.
all-features = true

[advisories]
# Unmaintained, unsound and yanked crates fail the check just as vulnerable
# ones do, unless they are listed here with the reason they are accepted.
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained: a compile-time proc-macro that pingora-core 0.9.0 depends on, with no upgrade available. Remove this entry once Pingora stops using it." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained: serde_yaml, which pingora-core 0.9.0 uses to parse the YAML configuration file an operator passes with -c, depends on it, with no upgrade available. Remove this entry once Pingora stops using serde_yaml." },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3: data from a stream abandoned on a reused context leaks into the next stream. The fix, zstd 0.14.3, is a major version that pingora-core 0.9.0 and pingora-header-serde 0.9.0 do not allow. durable-cache reaches zstd only through them: pingora-header-serde compresses each stored response header in one call, not as a stream. Remove this entry once Pingora moves to zstd 0.14." },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.2.4: Seekable::decompress sets a Vec length beyond its capacity. The fix, zstd-safe 8.2.0, is a major version that pingora-header-serde 0.9.0 does not allow, and no Pingora crate uses the seekable API. Remove this entry once Pingora moves to zstd-safe 8." },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.2.4: a failed streaming decompression of a legacy frame exposes uninitialised memory. The fix, zstd-safe 8.2.0, is a major version that pingora-header-serde 0.9.0 does not allow. durable-cache decompresses only the headers it stored, each in one call; pingora-core streams zstd only for proxies that enable response compression or decompression. Remove this entry once Pingora moves to zstd-safe 8." },
]

[licenses]
# Exactly the licences found in the graph on 2026-09-26, all permissive. The
# list is closed on purpose: a dependency update that brings in any other
# licence fails this check, so the change gets a human decision before it
# ships. (r-efi's LGPL-2.1-or-later is one option of three, beside MIT and
# Apache-2.0, so it needs no entry.)
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are reported, not refused: most are inherited from
# Pingora and its dependencies, and only an upstream change removes them.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# crates.io only: no other registry, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
