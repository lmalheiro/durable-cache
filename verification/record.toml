# --- Unsafe code: Kani with the system calls stubbed, and an exhaustive ---
# --- check of the ring's table (phase 1) --------------------------------

[[check]]
test_case = "TC-STORAGE.UNSAFE-01"
property = "Whatever the reads into a buffer's spare capacity return, the buffer claims exactly the bytes the kernel wrote, never past where the fill stops, and holds them all when the fill succeeds."
requirements = ["FDS-STORAGE.PAGECACHE-01"]
checker = "kani"
harness = "tc_storage_unsafe_01_a_fill_claims_only_what_the_kernel_wrote"
bounds = "a buffer holding up to 2 bytes, filled up to 4; every result of the reads, interrupted once; loops unwound 8 times"
runs = "change"
assumes = ["pread_blocking and pread_nowait are stubbed by the kernel's contract: they write any number of the bytes asked for and return it, or fail with -1 and set errno", "not_supported is stubbed without the message it formats"]
duration = "2 min 14 s on a change (local, 2026-11-26)"

[[check]]
test_case = "TC-STORAGE.UNSAFE-01"
property = "A slot of the io_uring ring keeps its buffer and file until the kernel has completed its operation, frees them once the future is gone too, and each future takes its own operation's result, once, whatever order the completions arrive in."
requirements = ["FDS-STORAGE.IOURING-01"]
checker = "exhaustive"
harness = "tc_storage_unsafe_01_every_order_keeps_buffers_until_completed"
bounds = "every order of two operations' submission, completion by the kernel, up to two polls, and drop: 10,735 orders"
runs = "change"
assumes = ["the kernel completes each operation once, as io_uring does", "the table is used under its mutex, so its events are serial"]
duration = "0.2 s on a change (local, 2026-11-26)"

# --- Concurrency: loom and shuttle (phase 1) -----------------------------

[[check]]
test_case = "TC-STORAGE.CHANGELOCKS-01"
property = "Two changes to one key never run at once."
requirements = ["FDS-STORAGE.METAUPDATE-01"]
checker = "loom"
harness = "tc_storage_changelocks_01_one_change_per_key"
bounds = "two threads changing one key; at most 2 preemptions on a change, 3 daily"
runs = "change"
assumes = ["loom's locks, swapped in through crate::sync, behave as the standard library's, without poisoning"]
duration = "0.3 s on a change, 0.3 s daily (local, 2026-11-24)"

[[check]]
test_case = "TC-STORAGE.CHANGELOCKS-01"
property = "When the switch to read-only returns, every change that began before it has ended, none begins after it, and a reader of the key's lock neither waits forever nor makes another thread wait forever."
requirements = ["FDS-COMPAT.READONLY-02"]
checker = "loom"
harness = "tc_storage_changelocks_01_read_only_waits_for_changes_and_admits_none"
bounds = "a change, a reader and the switch to read-only; at most 2 preemptions on a change, 3 daily"
runs = "change"
assumes = ["loom's locks, swapped in through crate::sync, behave as the standard library's, without poisoning"]
duration = "0.2 s on a change, 0.3 s daily (local, 2026-11-24)"

[[check]]
test_case = "TC-STORAGE.INLINESLOTS-01"
property = "Never more inline slots taken than the limit, and every one given back."
requirements = ["FDS-STORAGE.INLINEWRITES-02"]
checker = "loom"
harness = "tc_storage_inlineslots_01_never_more_than_the_limit"
bounds = "three operations, two slots, eight workers; at most 2 preemptions on a change, 3 daily"
runs = "change"
duration = "1.4 s on a change, 12.8 s daily (local, 2026-11-24)"

[[check]]
test_case = "TC-STORAGE.INLINESLOTS-01"
property = "Never more inline slots taken than the runtime's workers less one, and every one given back."
requirements = ["FDS-STORAGE.INLINEWRITES-02"]
checker = "loom"
harness = "tc_storage_inlineslots_01_never_more_than_the_workers_less_one"
bounds = "three operations, three slots, two workers; at most 2 preemptions on a change, 3 daily"
runs = "change"
duration = "1.0 s on a change, 6.1 s daily (local, 2026-11-24)"

[[check]]
test_case = "TC-STORAGE.INLINESLOTS-01"
property = "A runtime of one worker gives no inline slot."
requirements = ["FDS-STORAGE.INLINEWRITES-02"]
checker = "loom"
harness = "tc_storage_inlineslots_01_one_worker_spares_none"
bounds = "three operations, three slots, one worker; at most 2 preemptions on a change, 3 daily"
runs = "change"
duration = "0.3 s on a change, 0.5 s daily (local, 2026-11-24)"

[[check]]
test_case = "TC-STORAGE.INFLIGHT-01"
property = "Of two stores of one key opening at once, in whichever order they reach the registry, the most recent is the one with the higher id; each is found by its own tag; once both end, the key has no entry."
requirements = ["FDS-STORAGE.PARTIAL-02"]
checker = "loom"
harness = "tc_storage_inflight_01_the_most_recent_of_two_stores_opening_at_once"
bounds = "two stores opening at once; at most 2 preemptions on a change, 3 daily"
runs = "change"
assumes = ["loom's lock and atomics, swapped in through crate::sync, behave as the standard library's, without poisoning; the outcome's OnceLock and the readers' Notify stay the standard library's and Tokio's, used here without contention"]
duration = "0.2 s on a change, 0.2 s daily (local, 2026-11-26)"

[[check]]
test_case = "TC-STORAGE.INFLIGHT-01"
property = "A purge beside a store that opens and one that ends ends the store in flight throughout, and reports it; untagged lookups find only a store it did not end; a store in flight is found by its tag, purged or not; a store that ends leaves the registry."
requirements = ["FDS-STORAGE.PARTIAL-02", "FRE-COMPLIANCE.PURGE-01"]
checker = "loom"
harness = "tc_storage_inflight_01_a_purge_ends_the_stores_in_flight"
bounds = "a store in flight throughout, one opening and one ending beside a purge; at most 2 preemptions on a change, 3 daily"
runs = "change"
assumes = ["loom's lock and atomics, swapped in through crate::sync, behave as the standard library's, without poisoning"]
duration = "0.2 s on a change, 0.2 s daily (local, 2026-11-26)"

# --- The protocol across crashes --------------------------------------
# The replay of a log-writes device (phase 1); the protocol model's
# invariants, proved with Veil (phase 2); the crash explorer on the real
# backend (phase 3).

[[planned]]
property = "In every state a replay of the device's writes reaches, on ext4 and on XFS, the restarted backend gives the expected result of TC-PERSISTENCE.CRASHSAFE-02."
requirements = ["HLR-PERSISTENCE.CRASHSAFE-02"]
checker = "log-writes"
phase = 1

[[planned]]
property = "Synchronised stores: a published name never refers to data that is not on stable storage."
requirements = ["ADR-PERSISTENCE.DURABILITY-02", "FDS-STORAGE.PUBLISH-03", "ADR-STORAGE.ATOMICPUBLISH-01"]
checker = "veil"
phase = 2

[[planned]]
property = "No mixtures: in every state a crash can leave, the restarted backend serves each object as one version it stored, or misses it, after stores, in-place metadata updates and withdrawals alike."
requirements = ["HLR-PERSISTENCE.CRASHSAFE-02", "FDS-STORAGE.METAUPDATE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Purges hold: no crash undoes a purge the backend acknowledged."
requirements = ["FRE-COMPLIANCE.PURGEDURABLE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Purges end in-flight stores: no store in flight when a purge invalidates its key lands after the purge."
requirements = ["FRE-COMPLIANCE.PURGE-01", "FDS-STORAGE.PURGE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Unsynchronised stores: with the discard on, no record or temporary written before a host restart is reachable after it; with it off, on a file system that records a file's length only once its data is written, a record whose body did not reach the device reads short, and is a miss."
requirements = ["ADR-PERSISTENCE.UNSYNCED-01", "FDS-PERSISTENCE.CRASHDISCARD-01"]
checker = "veil"
phase = 2

[[planned]]
property = "The restart scan removes only leftovers: never the temporary of a writer still running, process identifiers reused and hot upgrades included."
requirements = ["FDS-STORAGE.RECLAIM-01", "ADR-STORAGE.WRITERID-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Recovery beside live traffic admits no ghost entry, and leaves the eviction manager's entries matching the records that are published."
requirements = ["FDS-EVICTION.STARTUP-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Hot upgrade: once the switch to read-only has returned, the old process publishes, purges, updates, expires and reclaims nothing."
requirements = ["FDS-COMPAT.READONLY-02", "FRE-COMPAT.HOTUPGRADE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "In every state the file-system library allows a crash to leave after the scenario tests' system calls, the restarted backend gives the expected result of TC-PERSISTENCE.CRASHSAFE-02."
requirements = ["HLR-PERSISTENCE.CRASHSAFE-02"]
checker = "crash-explorer"
phase = 3

# --- The code against the model: Aeneas (pilot in phase 4, phase 5) ------

[[planned]]
property = "Publishing a store, purging, expiring, updating metadata, and classifying what the restart scan finds each do what the protocol model's step says, given that the caller holds the key's publication lock."
requirements = ["FDS-STORAGE.PUBLISH-03", "FDS-STORAGE.PURGE-01", "FDS-STORAGE.EXPIRE-01", "FDS-STORAGE.METAUPDATE-01", "FDS-STORAGE.RECLAIM-01"]
checker = "aeneas"
phase = 5

# --- What no check establishes ------------------------------------------

[[unchecked]]
property = "The async layer and Tokio's scheduling."
reason = "No checker of the plan reaches async code: Kani runs no await, loom no Tokio, and Charon translates no async function."

[[unchecked]]
property = "pingora-cache beyond the storage contract."
reason = "Its behaviour is the framework's; the checks assume the contract the storage-contract library states, checked against MemCache."

[[unchecked]]
property = "The kernel and the file systems."
reason = "Their behaviour is assumed, per profile, by the file-system library; only the log-writes replays compare it with a real kernel."

[[unchecked]]
property = "A storage device that honours flushes."
reason = "HLR-PERSISTENCE.CRASHSAFE-02 assumes it, as the storage layer's responsibility."

[[unchecked]]
property = "The kernel's side of io_uring."
reason = "The kernel completes the ring's writes; the checks stub it with every completion it may give."

[[unchecked]]
property = "A record is accepted only when every read-time check passes, and malformed bytes never make the reader panic."
reason = "Kani runs out of memory on the reader's buffers, whose lengths it reads from the header it checks; the tests check each rejection of SDS-LAYOUT.OBJECTFILE-03 one by one."

[[unchecked]]
property = "An object's name is 32 lowercase hexadecimal digits, and its path stays inside the cache directory."
reason = "hex::encode builds the name a character at a time, beyond what Kani finishes; the tests check the names' shape, and TC-LAYOUT.NAMES-01 checks every name's shard."

[[unchecked]]
property = "Parsing a writer lease's name gives back the identity it was formatted from."
reason = "The name is formatted through std::fmt, which Kani cannot follow within the memory a run has; parsing refuses any name that does not format back to itself, and the tests check the round trip."

[[unchecked]]
property = "For every stored deadline and every instant, the internal-metadata segment an expiry writes is no longer than the one it replaces."
reason = "CacheMeta::serialize also compresses the header segment with zstd, C code Kani cannot follow, and the internal segment's own encoder is private to pingora-cache; the tests cover every width the encoding gives a deadline (FDS-STORAGE.EXPIRE-01)."

[[unchecked]]
property = "A partial hit's reader waiting for a store in flight wakes on each chunk the store appends, and when the store ends, and never sleeps through one."
reason = "The reader waits on Tokio's Notify inside the hit handler's read loop, beside reads on the blocking pool; neither loom nor shuttle runs that loop without the runtime, and Notify's own guarantee (a waiter created before notify_waiters is woken by it) is Tokio's. The streaming tests (TC-COMPAT.STREAMING-02) exercise it."
