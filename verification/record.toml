# The record of the properties the formal checks establish
# (HLR-VERIFICATION.FORMAL-01, ADR-VERIFICATION.FORMAL-01), in the layout
# SDS-VERIFICATION.LAYOUT-01 specifies. `cargo xtask verify` checks it
# against the repository (TC-VERIFICATION.RECORD-01).
#
# Three kinds of entry:
#
# [[check]]     a property a check establishes:
#   test_case     the test case the check implements, which names it
#   property      what it establishes, in one sentence
#   requirements  the requirements the property is of
#   checker       kani or loom
#   harness       the check's function, named tc_<test case>_<what>
#   bounds        what the check covers: its inputs, threads or states
#   runs          change (each proposed change) or daily
#   assumes       the stubs and axioms its result rests on
#   duration      how long its last run took, with where and when
#
# [[planned]]   a property a check is to establish, in the phase of the
#               plan (Appendix D of the specification) that writes it:
#   property, requirements, checker, phase
#
# [[unchecked]] what no check establishes, and why: property, reason
#
# A property moves from [[planned]] to [[check]] in the change that adds
# its check, and its test case is written or takes a new version in the
# same change. Dropping a [[check]] is a reviewed change like any other.

# --- Data formats: Kani on the code (phase 1), Lean proofs for every size
# (phase 5) -------------------------------------------------------------

[[check]]
test_case = "TC-LAYOUT.FORMATS-01"
property = "Decoding the encoding of a key with a user tag and no variance gives the key back."
requirements = ["SDS-LAYOUT.KEYSEGMENT-01"]
checker = "kani"
harness = "tc_layout_formats_01_a_key_round_trips"
bounds = "every primary hash; the user tag \"a\", as Kani finishes with no other: the empty tag is in the check of every segment and in the tests"
runs = "change"
duration = "3.9 s on a change (local, 2026-11-24)"

[[check]]
test_case = "TC-LAYOUT.FORMATS-01"
property = "Decoding the encoding of a key with a variance and a user tag gives the key back."
requirements = ["SDS-LAYOUT.KEYSEGMENT-01"]
checker = "kani"
harness = "tc_layout_formats_01_a_key_with_a_variance_round_trips"
bounds = "every primary hash and variance; the user tag \"a\""
runs = "change"
duration = "4.8 s on a change (local, 2026-11-24)"

[[check]]
test_case = "TC-LAYOUT.FORMATS-01"
property = "Any key segment decodes or fails without a panic, and one that decodes is the encoding of the key it decodes to, so each key has one encoding."
requirements = ["SDS-LAYOUT.KEYSEGMENT-01"]
checker = "kani"
harness = "tc_layout_formats_01_any_segment_decodes_or_fails"
bounds = "every byte string of up to 37 bytes; loops unwound 40 times"
runs = "change"
assumes = ["key_codec::user_tag is stubbed: ASCII tags accepted and every other rejected; std::str::from_utf8, which Kani cannot follow over unknown bytes, is trusted for the rest of UTF-8"]
duration = "1 min 51 s on a change (local, 2026-11-24)"

[[check]]
test_case = "TC-LAYOUT.FORMATS-01"
property = "Any 44 bytes check as a record header, and the offsets of its parts compute, without a panic or an overflow."
requirements = ["SDS-LAYOUT.OBJECTFILE-03"]
checker = "kani"
harness = "tc_layout_formats_01_any_header_checks_without_panic"
bounds = "every value of the 44 bytes"
runs = "change"
assumes = ["crc32c::crc32c is stubbed by another function of the same bytes; the property holds for any"]
duration = "9.6 s on a change (local, 2026-11-24)"

[[check]]
test_case = "TC-LAYOUT.FORMATS-01"
property = "A header built and sealed checks exactly when its metadata segments fit its capacity, gives back what it was built with, and once withdrawn checks as withdrawn."
requirements = ["SDS-LAYOUT.OBJECTFILE-03"]
checker = "kani"
harness = "tc_layout_formats_01_a_sealed_header_checks"
bounds = "every metadata capacity, body length and body checksum; fixed key and segments"
runs = "change"
assumes = ["crc32c::crc32c and crc32c::crc32c_append are stubbed by another function of the same bytes; the property holds for any"]
duration = "20.4 s on a change (local, 2026-11-24)"

