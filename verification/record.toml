# --- The protocol across crashes --------------------------------------
# The replay of a log-writes device (phase 1); the protocol model's
# invariants, proved with Veil (phase 2); the crash explorer on the real
# backend (phase 3).

[[planned]]
property = "In every state a replay of the device's writes reaches, on ext4 and on XFS, the restarted backend gives the expected result of TC-PERSISTENCE.CRASHSAFE-02."
requirements = ["HLR-PERSISTENCE.CRASHSAFE-02"]
checker = "log-writes"
phase = 1

[[planned]]
property = "Synchronised stores: a published name never refers to data that is not on stable storage."
requirements = ["ADR-PERSISTENCE.DURABILITY-02", "FDS-STORAGE.PUBLISH-03", "ADR-STORAGE.ATOMICPUBLISH-01"]
checker = "veil"
phase = 2

[[planned]]
property = "No mixtures: in every state a crash can leave, the restarted backend serves each object as one version it stored, or misses it, after stores, in-place metadata updates and withdrawals alike."
requirements = ["HLR-PERSISTENCE.CRASHSAFE-02", "FDS-STORAGE.METAUPDATE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Purges hold: no crash undoes a purge the backend acknowledged."
requirements = ["FRE-COMPLIANCE.PURGEDURABLE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Purges end in-flight stores: no store in flight when a purge invalidates its key lands after the purge."
requirements = ["FRE-COMPLIANCE.PURGE-01", "FDS-STORAGE.PURGE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Unsynchronised stores: with the discard on, no record or temporary written before a host restart is reachable after it; with it off, on a file system that records a file's length only once its data is written, a record whose body did not reach the device reads short, and is a miss."
requirements = ["ADR-PERSISTENCE.UNSYNCED-01", "FDS-PERSISTENCE.CRASHDISCARD-01"]
checker = "veil"
phase = 2

[[planned]]
property = "The restart scan removes only leftovers: never the temporary of a writer still running, process identifiers reused and hot upgrades included."
requirements = ["FDS-STORAGE.RECLAIM-01", "ADR-STORAGE.WRITERID-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Recovery beside live traffic admits no ghost entry, and leaves the eviction manager's entries matching the records that are published."
requirements = ["FDS-EVICTION.STARTUP-01"]
checker = "veil"
phase = 2

[[planned]]
property = "Hot upgrade: once the switch to read-only has returned, the old process publishes, purges, updates, expires and reclaims nothing."
requirements = ["FDS-COMPAT.READONLY-02", "FRE-COMPAT.HOTUPGRADE-01"]
checker = "veil"
phase = 2

[[planned]]
property = "In every state the file-system library allows a crash to leave after the scenario tests' system calls, the restarted backend gives the expected result of TC-PERSISTENCE.CRASHSAFE-02."
requirements = ["HLR-PERSISTENCE.CRASHSAFE-02"]
checker = "crash-explorer"
phase = 3

# --- The code against the model: Aeneas (pilot in phase 4, phase 5) ------

[[planned]]
property = "Publishing a store, purging, expiring, updating metadata, and classifying what the restart scan finds each do what the protocol model's step says, given that the caller holds the key's publication lock."
requirements = ["FDS-STORAGE.PUBLISH-03", "FDS-STORAGE.PURGE-01", "FDS-STORAGE.EXPIRE-01", "FDS-STORAGE.METAUPDATE-01", "FDS-STORAGE.RECLAIM-01"]
checker = "aeneas"
phase = 5

# --- What no check establishes ------------------------------------------

[[unchecked]]
property = "The async layer and Tokio's scheduling."
reason = "No checker of the plan reaches async code: Kani runs no await, loom no Tokio, and Charon translates no async function."

[[unchecked]]
property = "pingora-cache beyond the storage contract."
reason = "Its behaviour is the framework's; the checks assume the contract the storage-contract library states, checked against MemCache."

[[unchecked]]
property = "The kernel and the file systems."
reason = "Their behaviour is assumed, per profile, by the file-system library; only the log-writes replays compare it with a real kernel."

[[unchecked]]
property = "A storage device that honours flushes."
reason = "HLR-PERSISTENCE.CRASHSAFE-02 assumes it, as the storage layer's responsibility."

[[unchecked]]
property = "The kernel's side of io_uring."
reason = "The kernel completes the ring's writes; the checks stub it with every completion it may give."
